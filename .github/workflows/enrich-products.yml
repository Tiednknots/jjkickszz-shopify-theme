name: AI Product Enrichment

on:
  # Allows you to trigger the script manually from the GitHub website
  workflow_dispatch:
  # Runs automatically when you push code updates
  push:
    branches:
      - main
    paths:
      - 'scripts/ai_product_enrichment.py'

jobs:
  enrich:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Enrichment Script
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN:  ${{ secrets.SHOPIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/ai_product_enrichment.py
